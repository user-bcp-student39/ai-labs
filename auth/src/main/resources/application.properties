quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
# Fuera del laboratorio: AUTH_TOKEN_SECRET es la ruta a la clave privada RSA (PEM); sin ella no se emiten tokens.
auth.token.signing-key=${AUTH_TOKEN_SECRET:}
# AUTH_TOKEN_ISSUER y AUTH_TOKEN_AUDIENCE deben coincidir con la configuración del verificador de API.
auth.token.issuer=${AUTH_TOKEN_ISSUER:}
auth.token.audience=${AUTH_TOKEN_AUDIENCE:}
%test.auth.token.signing-key=jwt/test-private-key.pem
%test.auth.token.issuer=workshop-auth-test
%test.auth.token.audience=workshop-api-test
